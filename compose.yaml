# Producao num servidor unico: API + PostgreSQL 18 + backup diario.
# Limites de memoria validados em 2 nucleos e 1 GB (perf/compose.server.yaml, perf/RESULTADOS.md):
# pico de 441 MiB na API e 105 MiB no banco. Variaveis no .env (ver .env.example); migracao do Neon no README.
services:
  postgres:
    image: postgres:18.6
    container_name: app-adm-obras-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_adm_obras}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # Memoria do banco dimensionada para dividir 1 GB com a API
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 30
    # A partir da 18, a imagem guarda os dados em /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    # Sem porta publicada: so a API e o backup acessam, pela rede interna do compose
    mem_limit: 300m
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-adm-obras
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Banco do proprio compose: sobrescreve DB_URL/DB_USERNAME/DB_PASSWORD que estiverem no .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-app_adm_obras}
      DB_USERNAME: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Heap menor que o padrao da imagem (512m) para caber junto com o banco
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx384m}
    ports:
      # Porta do servidor (APP_PORT no .env, padrao 8080) -> 8080 dentro do conteiner
      - '${APP_PORT:-8080}:8080'
    mem_limit: 600m
    restart: unless-stopped

  # pg_dump diario em ./backups, guardando os ultimos BACKUP_KEEP_DAYS dias.
  # Copie os arquivos para fora do servidor: backup no mesmo disco nao protege contra perda do servidor.
  backup:
    image: postgres:18.6
    container_name: app-adm-obras-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-app_adm_obras}
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-postgres.sh:/backup-postgres.sh:ro
    entrypoint: ['sh', '/backup-postgres.sh']
    mem_limit: 64m
    restart: unless-stopped

volumes:
  postgres-data:
