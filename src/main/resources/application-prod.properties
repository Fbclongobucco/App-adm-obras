# Perfil de producao: PostgreSQL. Nada e semeado automaticamente.
# Credenciais e URL vem exclusivamente de variaveis de ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.bootstrap.enabled=false

# Em producao, defina APP_CORS_ALLOWED_ORIGINS com o dominio do frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Prevent Spring Boot from starting Docker Compose in production
spring.docker.compose.enabled=false

# Documentacao da API nunca e servida em producao
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Console do H2 nunca e exposto em producao
spring.h2.console.enabled=false

# Segredo JWT obrigatorio, sem valor padrao: Base64 com no minimo 32 bytes
app.security.jwt.secret=${APP_JWT_SECRET}
# Cookie do refresh token sempre Secure em producao (nao configuravel)
app.security.refresh-cookie.secure=true
