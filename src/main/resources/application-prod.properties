# Perfil de producao: PostgreSQL. Nada e semeado automaticamente.
# Credenciais e URL vem exclusivamente de variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app_adm_obras}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.bootstrap.enabled=false

# Em producao, defina APP_CORS_ALLOWED_ORIGINS com o dominio do frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
