# Perfil de producao: PostgreSQL. Nada e semeado automaticamente.
# Credenciais e URL vem exclusivamente de variaveis de ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.bootstrap.enabled=false

# Em producao, defina APP_CORS_ALLOWED_ORIGINS com o dominio do frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Prevent Spring Boot from starting Docker Compose in production
spring.docker.compose.enabled=false
