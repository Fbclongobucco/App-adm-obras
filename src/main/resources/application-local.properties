# Perfil de desenvolvimento: PostgreSQL em conteiner (compose.local.yaml), iniciado pela aplicacao.
# Exige Docker. URL e credenciais vem do conteiner (service connection do Spring Boot).
# O conteiner continua de pe entre reinicios e os dados persistem.
# Zerar a base: docker compose -f compose.local.yaml down -v
# O usuario admin do bootstrap e criado se ainda nao existir (admin@admin.com / admin123, ou os
# valores de APP_BOOTSTRAP_ADMIN_*). Para desligar: APP_BOOTSTRAP_ENABLED=false.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.local.yaml
spring.docker.compose.lifecycle-management=start-only

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.com.longobuccodev.app_adm_obras=DEBUG

# Documentacao da API: /swagger-ui.html e /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Segredo JWT SOMENTE para desenvolvimento e testes. Nunca usar em producao.
app.security.jwt.secret=n55WDtu199NjOvSqi0sDW0UzYahvQ+u3o91Gb8UIx3Rf6ut+CPTfqrirQRl7gbrb
# HTTP sem TLS em desenvolvimento
app.security.refresh-cookie.secure=false

# Bootstrap do admin ligado por padrao em desenvolvimento
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
