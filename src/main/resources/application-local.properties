# Perfil de desenvolvimento: H2 em memoria. O usuario admin do bootstrap e
# criado a cada inicializacao (admin@admin.com / admin123, ou os valores de
# APP_BOOTSTRAP_ADMIN_*). Para desligar: APP_BOOTSTRAP_ENABLED=false.
spring.datasource.url=jdbc:h2:mem:app-adm-obras;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=none

# So em local: um banco ja usado com ddl-auto recebe baseline em vez de falhar.
# Em prod e test, schema nao rastreado pelo Flyway impede o boot.
spring.flyway.baseline-on-migrate=true

logging.level.com.longobuccodev.app_adm_obras=DEBUG

# Documentacao da API: /swagger-ui.html e /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Console do H2: /h2-console (JDBC URL acima, usuario sa, senha vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo JWT SOMENTE para desenvolvimento e testes. Nunca usar em producao.
app.security.jwt.secret=n55WDtu199NjOvSqi0sDW0UzYahvQ+u3o91Gb8UIx3Rf6ut+CPTfqrirQRl7gbrb
# HTTP sem TLS em desenvolvimento
app.security.refresh-cookie.secure=false

# Bootstrap do admin ligado por padrao em desenvolvimento
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
