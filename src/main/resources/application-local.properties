# Perfil de desenvolvimento: H2 em memoria, sem usuario bootstrap.
# Ative o bootstrap com APP_BOOTSTRAP_ENABLED=true se precisar logar.
spring.datasource.url=jdbc:h2:mem:app-adm-obras;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=update

logging.level.com.longobuccodev.app_adm_obras=DEBUG
