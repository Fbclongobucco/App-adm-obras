spring.application.name=app-adm-obras

# Perfil ativo padrao. "local" usa PostgreSQL em conteiner (compose.local.yaml, exige Docker) e "test" usa
# H2; os dois criam o usuario admin (admin@admin.com / admin123). "prod" usa PostgreSQL externo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.open-in-view=false

# Virtual threads no Tomcat, no @Scheduled e no @Async. Desligavel por ambiente para comparar
# desempenho (perf/run.sh --threads off).
spring.threads.virtual.enabled=${APP_VIRTUAL_THREADS:true}
# Com virtual threads, o pool de conexoes e o limite efetivo de concorrencia no banco. 10 e o padrao do Hikari.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}

# Schema e propriedade das migracoes Flyway (src/main/resources/db/migration).
# Hibernate nunca cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# Associacoes sao LAZY; o acesso a uma delas carrega a mesma associacao de todas as entidades da
# sessao em uma consulta (IN com ate 100 ids, o tamanho maximo de pagina da API).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# CORS: origens liberadas para o frontend Next.js
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Bootstrap do usuario admin. Ligado por padrao em "local" e "test";
# desligado aqui e fixo como desligado em "prod".
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Administrador}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@admin.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}

# Prevent Spring Boot from managing Docker Compose lifecycle
spring.docker.compose.enabled=false

# Versao do artefato, preenchida pelo Maven (resource filtering)
app.version=@project.version@

# Documentacao da API (springdoc/Swagger UI). Desligada por padrao;
# so os perfis local e test a habilitam.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Autenticacao stateless: access token JWT (HS256) e refresh token em cookie.
# O segredo nao tem valor aqui: local/test definem um de desenvolvimento,
# prod exige APP_JWT_SECRET.
app.security.jwt.issuer=app-adm-obras
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
# Reuso de refresh token ja trocado dentro deste prazo renova a sessao em vez de revoga-la (0 desliga)
app.security.jwt.refresh-reuse-grace=30s

# Cookie do refresh token. SameSite=None so para frontend e API em sites
# diferentes sem proxy, e exige Secure.
app.security.refresh-cookie.secure=${APP_REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie.same-site=${APP_REFRESH_COOKIE_SAME_SITE:Strict}
app.security.refresh-cookie.partitioned=${APP_REFRESH_COOKIE_PARTITIONED:false}
