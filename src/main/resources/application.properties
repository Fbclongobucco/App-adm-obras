spring.application.name=app-adm-obras

spring.datasource.url=jdbc:h2:mem:app-adm-obras;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.security.operador.username=${APP_OPERADOR_USERNAME:operador}
app.security.operador.password=${APP_OPERADOR_PASSWORD:operador123}
