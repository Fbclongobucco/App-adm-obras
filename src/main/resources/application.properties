spring.application.name=app-adm-obras

# Perfil ativo padrao. Use "test" para rodar com o usuario bootstrap
# (admin@admim.com / admin123) e "prod" para PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# CORS: origens liberadas para o frontend Next.js
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Bootstrap de usuario padrao. Ativado apenas no perfil "test".
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Administrador}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@admim.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
