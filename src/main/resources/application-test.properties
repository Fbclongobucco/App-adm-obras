# Perfil de teste: H2 em memoria com usuario bootstrap para desenvolvimento
# e testes manuais da API. Login: admin@admin.com / admin123
spring.datasource.url=jdbc:h2:mem:app-adm-obras-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=none

app.bootstrap.enabled=true
app.bootstrap.admin.name=Administrador
app.bootstrap.admin.email=admin@admin.com
app.bootstrap.admin.password=admin123

# Documentacao da API: /swagger-ui.html e /v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Console do H2: /h2-console (JDBC URL acima, usuario sa, senha vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo JWT SOMENTE para desenvolvimento e testes. Nunca usar em producao.
app.security.jwt.secret=n55WDtu199NjOvSqi0sDW0UzYahvQ+u3o91Gb8UIx3Rf6ut+CPTfqrirQRl7gbrb
# HTTP sem TLS em desenvolvimento
app.security.refresh-cookie.secure=false
