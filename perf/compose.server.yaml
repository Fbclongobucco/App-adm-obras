# Simula o servidor de producao proposto: app e PostgreSQL na MESMA maquina de 2 nucleos e 1 GB
# (alvo "server" de perf/run.sh). Os dois conteineres ficam presos aos mesmos 2 nucleos (cpuset) e somam
# 900 MB, deixando ~100 MB para o sistema. Limites de memoria sao o ponto de partida proposto, a validar
# com docker stats. PostgreSQL 18, a mesma versao do Neon de producao. Nao usar em producao como esta.
name: app-adm-obras-server

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: app_adm_obras
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-perf
    # Memoria do banco dimensionada para dividir 1 GB com a app; pg_stat_statements para o relatorio
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_adm_obras']
      interval: 2s
      retries: 30
    # A partir da 18, a imagem guarda os dados em /var/lib/postgresql/18/docker
    volumes:
      - postgres-server:/var/lib/postgresql
    cpuset: '0,1'
    mem_limit: 300m

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/app_adm_obras
      DB_USERNAME: app
      DB_PASSWORD: app-perf
      # Segredo SOMENTE do ambiente de carga
      APP_JWT_SECRET: M6W5eft6dKmo2A+8er7p1QUY8heOCll9NYpmfwIrqQ1drInXu2oPvczCw0ilGLDr
      APP_VIRTUAL_THREADS: ${APP_VIRTUAL_THREADS:-true}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      # Heap menor que o padrao (512m) para caber junto com o banco
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx384m}
    ports:
      - '${PERF_APP_PORT:-8090}:8080'
    cpuset: '0,1'
    mem_limit: 600m

  # So roda sob demanda: docker compose run --rm k6 run /scripts/script.js
  k6:
    image: grafana/k6:1.3.0
    profiles: [tools]
    user: '${PERF_UID:-1000}:${PERF_GID:-1000}'
    volumes:
      - .:/scripts
      - ./results:/results

volumes:
  postgres-server:
